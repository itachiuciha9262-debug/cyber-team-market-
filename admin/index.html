<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTH Admin</title><link rel="stylesheet" href="../panel.css"><main><h1>Cyber Team Help · Admin</h1><p><a href="/">Main website</a></p><section id="auth"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="in">Sign in</button><button id="up">Create account</button><p id="msg"></p></section><section id="panel" hidden><p id="who"></p><button id="out">Sign out</button><h2>All service requests</h2><div id="items"></div><h2>Create request for client</h2><input id="uid" placeholder="Client Auth user UUID"><select id="service"><option>Website security review (authorized site only)</option><option>Account security setup and recovery guidance</option><option>Website hardening and updates</option><option>Backup and security review</option><option>Domain and DNS security review</option></select><textarea id="details" placeholder="Agreed service scope"></textarea><button id="create">Create request</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const $=id=>document.getElementById(id);let sb;
function msg(s){$('msg').textContent=s}
async function start(){sb=window.supabase.createClient(CTH_SUPABASE_URL,CTH_SUPABASE_ANON_KEY);const {data}=await sb.auth.getSession();if(data.session)await login(data.session.user)}
async function login(u){const {data:p,error}=await sb.from('profiles').select('role').eq('id',u.id).single();if(error||p.role!=='admin'){msg('Admin role not enabled for this account.');await sb.auth.signOut();return}$('auth').hidden=true;$('panel').hidden=false;$('who').textContent=u.email;await load()}
async function load(){const {data,error}=await sb.from('service_requests').select('*').order('created_at',{ascending:false});if(error){msg(error.message);return}$('items').innerHTML=(data||[]).map(x=>'<article><b>'+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>'+esc(x.status)+' · '+esc(x.user_id)+'</small><select id="s'+x.id+'"><option value="new">New</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button onclick="saveStatus('+x.id+')">Save</button></article>').join('')||'No requests yet.';for(const x of data||[])$('s'+x.id).value=x.status}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.saveStatus=async id=>{const {error}=await sb.from('service_requests').update({status:$('s'+id).value}).eq('id',id);msg(error?error.message:'Status updated');await load()};
$('in').onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else await login(data.user)};
$('up').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});msg(error?error.message:'Account created/requested. Confirm email if prompted.')};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('create').onclick=async()=>{const user_id=$('uid').value.trim(),details=$('details').value.trim();if(!user_id||!details)return msg('Enter client UUID and service details.');const {error}=await sb.from('service_requests').insert({user_id,title:$('service').value,details});msg(error?error.message:'Request created');if(!error){$('details').value='';await load()}};
start();
</script></main></html>
