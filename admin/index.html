<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTH Secure Admin</title><link rel="stylesheet" href="../panel.css"><main><h1>Cyber Team Help · Secure Admin</h1><p><a href="/">Main website</a></p><section id="auth"><h2>Owner sign-in</h2><input id="email" type="email" placeholder="Owner email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="in">Sign in</button><p id="msg" role="status"></p></section><section id="panel" hidden><p id="who"></p><button id="out">Sign out</button><h2>Website content</h2><p>Edit these fields and save. The public homepage must be connected to this content store before these changes appear on the main homepage.</p><div id="contentFields"></div><button id="saveContent">Save website content</button><h2>Products</h2><div id="products"></div><h3>Add product</h3><input id="pname" placeholder="Product name"><textarea id="pdesc" placeholder="Product description"></textarea><input id="pprice" type="number" step="0.01" placeholder="Price"><input id="pimage" type="url" placeholder="Public image URL (https://...)"><label><input id="ppub" type="checkbox"> Publish product</label><button id="addProduct">Add product</button><h2>Service requests</h2><div id="requests"></div><h2>Create a service request for a client</h2><input id="clientId" placeholder="Client Auth user UUID"><select id="service"><option>Website security review (authorized site only)</option><option>Account security setup and recovery guidance</option><option>Website hardening and updates</option><option>Backup and security review</option><option>Domain and DNS security review</option></select><textarea id="details" placeholder="Agreed service scope"></textarea><button id="createRequest">Create request</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const $=id=>document.getElementById(id);let sb;
function msg(s){$('msg').textContent=s}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function start(){sb=window.supabase.createClient(CTH_SUPABASE_URL,CTH_SUPABASE_ANON_KEY);const {data}=await sb.auth.getSession();if(data.session)await login(data.session.user)}
async function login(u){const {data:p,error}=await sb.from('profiles').select('role').eq('id',u.id).single();if(error||p?.role!=='admin'){msg('Access denied. This account is not the authorized administrator.');await sb.auth.signOut();return}$('auth').hidden=true;$('panel').hidden=false;$('who').textContent='Signed in: '+u.email;await Promise.all([loadContent(),loadProducts(),loadRequests()])}
const contentLabels={site_name:'Website name',hero_title:'Homepage title',hero_description:'Homepage description',about:'About section',contact_whatsapp:'Official WhatsApp link',contact_email:'Support email'};
async function loadContent(){const {data,error}=await sb.from('site_content').select('*').order('content_key');if(error)return msg(error.message);$('contentFields').innerHTML=(data||[]).map(x=>'<label>'+esc(contentLabels[x.content_key]||x.content_key)+'</label><textarea data-content-key="'+esc(x.content_key)+'">'+esc(x.content_value)+'</textarea>').join('')}
$('saveContent').onclick=async()=>{const rows=[...document.querySelectorAll('[data-content-key]')].map(el=>({content_key:el.dataset.contentKey,content_value:el.value,updated_at:new Date().toISOString()}));const {error}=await sb.from('site_content').upsert(rows,{onConflict:'content_key'});msg(error?'Save failed: '+error.message:'Website content saved. Main homepage integration is still required to display these fields there.')};
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('sort_order').order('created_at');if(error)return msg(error.message);$('products').innerHTML=(data||[]).map(p=>'<article data-product="'+p.id+'"><input data-f="name" value="'+esc(p.name)+'" placeholder="Name"><textarea data-f="description">'+esc(p.description)+'</textarea><input data-f="price" type="number" step="0.01" value="'+(p.price??'')+'" placeholder="Price"><input data-f="image_url" type="url" value="'+esc(p.image_url)+'" placeholder="Image URL"><label><input data-f="is_published" type="checkbox" '+(p.is_published?'checked':'')+'> Published</label><button data-save-product="'+p.id+'">Save</button><button data-delete-product="'+p.id+'">Delete</button></article>').join('')||'<p>No products added yet.</p>'}
$('addProduct').onclick=async()=>{const name=$('pname').value.trim();if(!name)return msg('Enter a product name.');const price=$('pprice').value;const {error}=await sb.from('products').insert({name,description:$('pdesc').value,price:price===''?null:Number(price),image_url:$('pimage').value,is_published:$('ppub').checked});msg(error?error.message:'Product added');if(!error){$('pname').value='';$('pdesc').value='';$('pprice').value='';$('pimage').value='';$('ppub').checked=false;await loadProducts()}};
$('products').addEventListener('click',async e=>{const save=e.target.closest('[data-save-product]');const del=e.target.closest('[data-delete-product]');if(save){const id=save.dataset.saveProduct,card=save.closest('article'),v=k=>card.querySelector('[data-f="'+k+'"]');const {error}=await sb.from('products').update({name:v('name').value.trim(),description:v('description').value,price:v('price').value===''?null:Number(v('price').value),image_url:v('image_url').value,is_published:v('is_published').checked,updated_at:new Date().toISOString()}).eq('id',id);msg(error?error.message:'Product updated');await loadProducts()}if(del&&confirm('Delete this product?')){const {error}=await sb.from('products').delete().eq('id',del.dataset.deleteProduct);msg(error?error.message:'Product deleted');await loadProducts()}});
async function loadRequests(){const {data,error}=await sb.from('service_requests').select('*').order('created_at',{ascending:false});if(error)return msg(error.message);$('requests').innerHTML=(data||[]).map(x=>'<article><b>'+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>'+esc(x.status)+' · '+esc(x.user_id)+'</small><select data-status="'+x.id+'"><option value="new">New</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button data-save-status="'+x.id+'">Save status</button></article>').join('')||'<p>No requests yet.</p>';for(const x of data||[])$('requests').querySelector('[data-status="'+x.id+'"]').value=x.status}
$('requests').addEventListener('click',async e=>{const b=e.target.closest('[data-save-status]');if(!b)return;const id=b.dataset.saveStatus,status=$('requests').querySelector('[data-status="'+id+'"]').value;const {error}=await sb.from('service_requests').update({status}).eq('id',id);msg(error?error.message:'Status updated');await loadRequests()});
$('in').onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else await login(data.user)};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('createRequest').onclick=async()=>{const user_id=$('clientId').value.trim(),details=$('details').value.trim();if(!user_id||!details)return msg('Enter client UUID and details.');const {error}=await sb.from('service_requests').insert({user_id,title:$('service').value,details});msg(error?error.message:'Request created');if(!error){$('details').value='';await loadRequests()}};
start();
</script></html>
